<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d0f" />
  <meta name="description" content="PWA familiar para acompanhar dieta, refeições, peso, cintura e aderência de Lígia e Edson." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Dieta Família" />
  <meta name="app-version" content="3.0.0" />
  <title>Dieta Família — Lígia & Edson</title>
  <link rel="manifest" href="./manifest.webmanifest?v=3.0.0" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./styles.css?v=2.0.0" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div><p class="eyebrow">DIETA FAMÍLIA</p><h1>Lígia & Edson</h1></div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;max-width:52%">
        <button id="installBtn" class="icon-button install-button" type="button" aria-label="Instalar aplicativo" title="Instalar aplicativo" hidden><span>＋</span></button>
        <small id="updateStatus" aria-live="polite" style="font-size:10px;line-height:1.2;color:var(--muted,#8f969e);text-align:right;white-space:nowrap">Versão atual: 3.0.0 · Verificando…</small>
      </div>
    </header>
    <main id="app" class="main-content" aria-live="polite"></main>
    <nav class="bottom-nav" aria-label="Navegação principal">
      <button class="nav-item active" data-route="today" type="button"><span class="nav-icon">✓</span><span>Hoje</span></button>
      <button class="nav-item" data-route="ligia" type="button"><span class="nav-icon">L</span><span>Lígia</span></button>
      <button class="nav-item" data-route="edson" type="button"><span class="nav-icon">E</span><span>Edson</span></button>
      <button class="nav-item" data-route="progress" type="button"><span class="nav-icon">↗</span><span>Progresso</span></button>
    </nav>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <dialog id="modal" class="modal">
    <form method="dialog" class="modal-card">
      <div class="modal-head"><div><p class="eyebrow">DIETA FAMÍLIA</p><h2 id="modalTitle">Detalhes</h2></div><button value="cancel" class="icon-button" aria-label="Fechar">×</button></div>
      <div id="modalBody" class="modal-body"></div>
    </form>
  </dialog>
  <script src="./family-app.js?v=3.0.0" defer></script>
  <script src="./enhancements.js?v=3.0.0" defer></script>
</body>
</html>
